name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_MIN_VERSION: "1.26.0"
  GO_VERSION: "1.26.5"
  GOWORK: "off"

jobs:
  minimum-go:
    name: Minimum Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_MIN_VERSION }}
      - run: go build ./...
      - run: go test -run '^$' ./...
      - run: go mod verify
      - run: go test -count=1 ./auth ./breaker ./clog ./config ./db ./metrics ./trace ./xerrors

  test:
    name: Test + Testcontainers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          go test -count=1 -json ./... | tee artifacts/test.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: artifacts/test.json
          retention-days: 14

  race:
    name: Race + Testcontainers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run race tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          go test -race -p 1 -count=1 -json ./... | tee artifacts/race.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: race-results
          path: artifacts/race.json
          retention-days: 14

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/bufbuild/buf/cmd/buf@v1.66.1
      - run: actionlint
      - run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: make lint exported-comments modernize-check markdown-check buf-lint

  api-examples:
    name: API + examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: make api-inventory-check api-compat-check examples-check examples-external-check
      - name: Verify real-backend scenarios
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          make examples-scenarios | tee artifacts/scenarios.txt
      - name: Run standalone examples
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          make example-all | tee artifacts/examples.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: example-results
          path: |
            artifacts/examples.txt
            artifacts/scenarios.txt
          retention-days: 14
