version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - (^|/)examples/
